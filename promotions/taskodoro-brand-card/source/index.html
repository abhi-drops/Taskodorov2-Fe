<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Taskodoro brand card</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geomini"; font-weight: 400; src: url("assets/fonts/geomini-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Geomini"; font-weight: 700; src: url("assets/fonts/geomini-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Google Sans Flex"; font-weight: 100 1000; src: url("assets/fonts/google-sans-flex-latin-wght-normal.woff2") format("woff2"); }
      :root {
        --yellow: #fbe05d;
        --coral: #ff7c8f;
        --blue: #96c3f7;
        --green: #c0ff91;
        --purple: #8b5cf6;
        --nav: #1e1e2a;
        --surface: #f4f5f7;
        --ink: #3c3c3c;
        --sh: 3px 7px 0 0 rgba(0, 0, 0, 0.2);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #f4f5f7; }
      #root { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: "Google Sans Flex", sans-serif; color: #000; }
      .slide {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1350px;
        padding: 72px 80px 172px;
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(244, 245, 247, 0.82), rgba(244, 245, 247, 0.82)),
          url("assets/img/background.jpg") center / 1900px auto,
          #f4f5f7;
      }
      .display { font-family: "Geomini", sans-serif; }
      .yellow { background: var(--yellow); }
      .coral { background: var(--coral); }
      .blue { background: var(--blue); }
      .green { background: var(--green); }

      /* brand row and footer, the same on every slide */
      .brand { display: flex; align-items: center; justify-content: space-between; }
      .brand .l { display: flex; align-items: center; gap: 18px; font-family: "Geomini", sans-serif; font-weight: 700; font-size: 40px; line-height: 48px; color: var(--nav); }
      .brand img { width: 68px; height: 69px; display: block; }
      .pg { display: inline-flex; align-items: center; height: 56px; padding: 0 20px; border: 5px solid var(--ink); background: #fff; box-shadow: var(--sh); font-family: "Geomini", sans-serif; font-weight: 700; font-size: 26px; color: var(--ink); }
      .foot { position: absolute; left: 80px; right: 80px; bottom: 64px; display: flex; align-items: center; justify-content: space-between; font-size: 28px; line-height: 36px; font-weight: 500; color: var(--ink); }
      .swipe { display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 24px; border: 5px solid var(--ink); background: var(--yellow); box-shadow: var(--sh); font-weight: 600; color: var(--nav); }

      .num { width: 104px; height: 104px; margin-top: 64px; display: flex; align-items: center; justify-content: center; border: 7px solid var(--ink); box-shadow: var(--sh); font-family: "Geomini", sans-serif; font-weight: 700; font-size: 64px; color: var(--nav); }
      h2 { margin-top: 84px; font-family: "Geomini", sans-serif; font-weight: 700; font-size: 78px; line-height: 88px; color: var(--nav); }
      .sub { margin-top: 24px; font-size: 38px; line-height: 50px; font-weight: 500; color: var(--ink); }
      .vis { margin-top: auto; }

      /* app pieces */
      .chip { display: inline-flex; align-items: center; height: 64px; padding: 0 24px; border: 6px solid var(--ink); background: #cbd5e1; box-shadow: var(--sh); font-family: "Geomini", sans-serif; font-size: 30px; color: var(--ink); white-space: nowrap; position: relative; z-index: 2; }
      .backdrop { border: 2px solid #d4d4d4; background: var(--surface); box-shadow: var(--sh); padding: 56px 26px 28px; margin-top: -32px; margin-left: -6px; display: flex; flex-direction: column; gap: 20px; }
      .note { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 26px; box-shadow: var(--sh); font-size: 28px; line-height: 38px; font-weight: 500; color: #000; }
      .note .txt { flex: 1; min-width: 0; }
      .ck { --s: 42px; position: relative; flex: none; width: var(--s); height: var(--s); }
      .ck .ring { display: block; width: var(--s); height: var(--s); object-fit: contain; }
      .ck .tick { position: absolute; left: calc(var(--s) * 0.064); top: calc(var(--s) * -0.3); width: calc(var(--s) * 1.4); height: calc(var(--s) * 1.4); max-width: none; object-fit: contain; }
      .done { text-decoration: line-through; opacity: 0.7; }
      .fld .lb { font-size: 24px; line-height: 32px; font-weight: 500; color: #334155; }
      .fld .sel { margin-top: 6px; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 18px; border: 5px solid var(--ink); background: #fff; box-shadow: var(--sh); font-size: 28px; font-weight: 500; color: var(--ink); }
      .counter { display: flex; align-items: stretch; height: 80px; margin-top: 18px; border: 6px solid var(--ink); }
      .counter .b { width: 84px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.5); }
      .counter .v { flex: 1; display: flex; align-items: center; justify-content: center; border-left: 6px solid var(--ink); border-right: 6px solid var(--ink); font-family: "Geomini", sans-serif; font-weight: 700; font-size: 40px; color: var(--ink); }
      .li { display: flex; align-items: center; gap: 16px; font-size: 28px; line-height: 38px; font-weight: 400; }
      .li .ck { --s: 34px; }
      .strip { background: var(--ink); height: 60px; padding: 0 22px; display: flex; align-items: center; justify-content: flex-end; font-size: 26px; font-weight: 600; box-shadow: var(--sh); }
      .later { display: flex; align-items: center; height: 72px; padding: 0 24px; border: 5px solid var(--ink); background: #fff; box-shadow: var(--sh); font-size: 30px; font-weight: 600; color: var(--nav); white-space: nowrap; }
      .lbl { font-size: 26px; line-height: 34px; font-weight: 600; color: #334155; }
      .sq { position: absolute; width: 300px; height: 300px; box-shadow: 5px 11px 0 0 rgba(0, 0, 0, 0.2); display: flex; align-items: flex-end; padding: 22px 28px; font-family: "Geomini", sans-serif; font-weight: 700; font-size: 110px; line-height: 100px; color: var(--nav); }
      .hd { display: flex; align-items: center; gap: 18px; position: relative; z-index: 2; }
      .addbtn { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border: 6px solid var(--ink); background: var(--purple); box-shadow: var(--sh); }
      .navpill { display: inline-flex; padding: 12px; border: 2px solid #d4d4d4; background: var(--surface); box-shadow: var(--sh); }
      .navpill div { display: flex; align-items: center; height: 64px; padding: 0 26px; font-size: 26px; font-weight: 500; }
      .sw { width: 56px; height: 56px; border-radius: 50%; display: block; }
      .sw.on { box-shadow: 0 0 0 5px var(--surface), 0 0 0 10px var(--ink); }
      .shot { position: absolute; border: 7px solid var(--ink); background: var(--surface); box-shadow: 5px 11px 0 0 rgba(0, 0, 0, 0.22); overflow: hidden; }
      .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
      .shot.phone { border-width: 9px; border-radius: 30px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1350">
      <!-- single page: logo, name, tagline -->
      <div class="clip slide" data-start="0" data-duration="1" data-track-index="0" style="align-items: center; justify-content: center; padding: 80px">
        <img src="assets/img/logo.png" alt="" style="width: 400px; height: 405px; display: block" />
        <div class="display" style="margin-top: 64px; font-weight: 700; font-size: 168px; line-height: 176px; color: var(--nav)">Taskodoro</div>
        <div style="margin-top: 20px; font-size: 64px; line-height: 80px; font-weight: 500; color: var(--ink)">Your comfort planner.</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
